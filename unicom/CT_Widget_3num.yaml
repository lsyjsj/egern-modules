name: 中国联通小组件（三号码独立版）
description: 中国联通 话费 语音 流量小组件（含定时保活）。支持 3 个手机号，每个号码显示为一个独立小组件（中国联通·号码1～3）。用法：先在模块 Env 里填写 3 个手机号，再分别用联通 App 登录每个号码并打开一次，自动抓取各号码的登录信息。
author: iBL3ND（三号码独立版由用户改写）
icon: https://iili.io/nEuB6Jt.png
compat_arguments:
  cuCapture: 'true'
  cuGeneralFlow: 'true'
  cuDirectionalFlow: 'true'
compat_arguments_schema:
  cuCapture:
    name: 中国联通数据抓取
    description: 直接打开 App 就可以（抓到数据后可以关闭）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuGeneralFlow:
    name: 显示通用流量
    description: 小组件流量统计包含通用流量（关闭则只统计定向流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
  cuDirectionalFlow:
    name: 显示定向流量
    description: 小组件流量统计包含定向流量（关闭则只统计通用流量）
    default_value: 'true'
    options:
    - 'true'
    - 'false'
env_schema:
  CU_PHONE_1:
    name: 手机号1
    description: 第 1 个要显示的联通手机号；填好后用联通 App 登录该号码并打开一次，自动抓取登录信息
    default_value: ''
  CU_PHONE_2:
    name: 手机号2
    description: 第 2 个要显示的联通手机号；填好后用联通 App 登录该号码并打开一次，自动抓取登录信息
    default_value: ''
  CU_PHONE_3:
    name: 手机号3
    description: 第 3 个要显示的联通手机号；填好后用联通 App 登录该号码并打开一次，自动抓取登录信息
    default_value: ''
dns: {}
scriptings:
- generic:
    name: china-unicom
    script_url: https://raw.githubusercontent.com/lsyjsj/egern-modules/main/unicom/Unicom_Widget_3num.JS
    env:
      CU_SHOW_GENERAL_FLOW: '{{{cuGeneralFlow}}}'
      CU_SHOW_DIRECTIONAL_FLOW: '{{{cuDirectionalFlow}}}'
- http_request:
    name: 中国联通 App 自动捕获
    match: '^https://m\.clien[{{{cuCapture}}}]\.10010\.com/'
    script_url: https://raw.githubusercontent.com/lsyjsj/egern-modules/main/unicom/Unicom_Widget_3num.JS
- schedule:
    name: 中国联通保活
    cron: '*/20 * * * *'
    script_url: https://raw.githubusercontent.com/lsyjsj/egern-modules/main/unicom/Unicom_Widget_3num.JS
mitm:
  hostnames:
    includes:
    - m.client.10010.com
widgets:
- name: 中国联通·号码1
  script_name: china-unicom
  env:
    CU_WIDGET: '1'
- name: 中国联通·号码2
  script_name: china-unicom
  env:
    CU_WIDGET: '2'
- name: 中国联通·号码3
  script_name: china-unicom
  env:
    CU_WIDGET: '3'
